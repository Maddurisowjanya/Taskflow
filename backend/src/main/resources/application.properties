# ==========================================
# TaskFlow Application Configuration
# ==========================================

# Application name (used in logging and Actuator)
spring.application.name=taskflow-backend

# Server port (default is 8080)
server.port=8080

# ==========================================
# MySQL Database Configuration
# ==========================================
# Replace 'localhost', 'taskflow_db', 'root', 'password' with your actual values
spring.datasource.url=jdbc:mysql://localhost:3306/taskflow?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql@123

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
# update = auto-update schema on startup (use 'validate' in production)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (disable in production)
spring.jpa.show-sql=true

# Format SQL queries for readability
spring.jpa.properties.hibernate.format_sql=true

# MySQL dialect for Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Naming strategy: converts camelCase fields to snake_case columns
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==========================================
# JWT Configuration
# ==========================================
# Secret key for signing JWT tokens (use a strong random string in production!)
app.jwt.secret=taskflow_super_secret_key_for_jwt_signing_must_be_at_least_256_bits_long_for_security
# Token expiration: 24 hours in milliseconds (86400000 ms = 24 hrs)
app.jwt.expiration=86400000

# ==========================================
# Swagger / OpenAPI Configuration
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ==========================================
# Logging Configuration
# ==========================================
logging.level.com.taskflow=DEBUG
logging.level.org.springframework.security=DEBUG
